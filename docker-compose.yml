# Local demo: SQL Server 2022 + BankCore API
#   docker compose up --build
#   then open http://localhost:8080/scalar
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BankCore#Dev2026"   # local demo only
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BankCore: "Server=sqlserver,1433;Database=BankCoreDb;User Id=sa;Password=BankCore#Dev2026;TrustServerCertificate=True"
      Jwt__SigningKey: "DOCKER-DEMO-ONLY-signing-key-0123456789-abcdefghijkl"
      Seed__Enabled: "true"
      Seed__DefaultPassword: "Demo@12345"
    ports:
      - "8080:8080"
